; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;

; Choose your board once
[platformio]
default_envs = ex1        ; switch this (or use the env picker in VS Code)

[env]
platform = espressif32
framework = arduino
board = esp32dev
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = CRLF
monitor_echo = yes

lib_deps = 
  duinowitchery/hd44780@^1.3.2
  dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2

extra_scripts = post:scripts/copy_fw.py

[env:ex1]
build_src_filter = +<ex1.cpp>

[env:ex2]
build_src_filter = +<ex2.cpp>

[env:ex3]
build_src_filter = +<ex3.cpp>

[env:ex4]
build_src_filter = +<ex4.cpp>

[env:ex5]
build_src_filter = +<ex5.cpp>

[env:ex6]
build_src_filter = +<ex6.cpp>

[env:example_esp32_memsize]
build_src_filter = +<example_esp32_memsize.cpp>